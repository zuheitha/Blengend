<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Custom Bloxd Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Crosshair for building */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            opacity: 0.8;
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        /* Game UI & Hotbar */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .header {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-weight: bold;
            font-size: 16px;
        }
        #hotbar {
            pointer-events: auto;
            align-self: center;
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 10px;
            gap: 8px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .hotbar-slot {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .hotbar-slot.active {
            border-color: #fff;
            transform: scale(1.1);
        }

        /* Mobile Touch Controls */
        .touch-zone {
            position: absolute;
            bottom: 80px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.3);
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-left { left: 30px; } /* Movement */
        #joystick-right { right: 30px; } /* Camera Look */
        
        .joystick-knob {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            opacity: 0.7;
            position: absolute;
        }
        
        #action-buttons {
            position: absolute;
            right: 30px;
            bottom: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }
        .action-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="game-container">
        <div id="crosshair"></div>
        <div id="renderer-target"></div>

        <div id="ui-layer">
            <div class="header">My Bloxd Engine v1.0</div>
            
            <!-- Block Selection Hotbar -->
            <div id="hotbar">
                <div class="hotbar-slot active" style="background: #4ade80;" onclick="selectBlock(0, 0x4ade80)"></div>
                <div class="hotbar-slot" style="background: #f43f5e;" onclick="selectBlock(1, 0xf43f5e)"></div>
                <div class="hotbar-slot" style="background: #3b82f6;" onclick="selectBlock(2, 0x3b82f6)"></div>
                <div class="hotbar-slot" style="background: #eab308;" onclick="selectBlock(3, 0xeab308)"></div>
            </div>
        </div>

        <!-- Left Joystick (Move) -->
        <div id="joystick-left" class="touch-zone">
            <div id="knob-left" class="joystick-knob"></div>
        </div>

        <!-- Right Joystick (Look Around) -->
        <div id="joystick-right" class="touch-zone">
            <div id="knob-right" class="joystick-knob"></div>
        </div>

        <!-- Place / Break Action Buttons -->
        <div id="action-buttons">
            <div class="action-btn" id="btn-place" onclick="triggerBuild(true)">➕</div>
            <div class="action-btn" id="btn-break" onclick="triggerBuild(false)" style="background: rgba(239,68,68,0.7);">🔨</div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION & SETUP
        // ==========================================
        const container = document.getElementById('renderer-target');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xbae6fd); // Sky Blue
        scene.fog = new THREE.FogExp2(0xbae6fd, 0.05);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(20, 40, 20);
        scene.add(sunLight);

        // Core Game variables
        let selectedColor = 0x4ade80;
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const blocksArray = [];
        
        // Player stats
        const player = {
            position: new THREE.Vector3(0, 1.5, 5),
            rotation: new THREE.Vector2(0, 0), // X = Yaw, Y = Pitch
            speed: 0.1
        };
        camera.position.copy(player.position);

        // Map generation (Flat spawn ground area)
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x71717a });
        for(let x = -10; x <= 10; x++) {
            for(let z = -10; z <= 10; z++) {
                const groundBlock = new THREE.Mesh(blockGeometry, floorMat);
                groundBlock.position.set(x, -0.5, z);
                scene.add(groundBlock);
                blocksArray.push(groundBlock);
            }
        }

        // ==========================================
        // TOUCH CONTROLS (CUSTOM JOYSTICKS)
        // ==========================================
        const moveVector = new THREE.Vector2(0, 0);
        const lookVector = new THREE.Vector2(0, 0);

        function setupJoystick(elementId, knobId, callback) {
            const element = document.getElementById(elementId);
            const knob = document.getElementById(knobId);
            let active = false;
            let startX, startY;

            element.addEventListener('touchstart', (e) => {
                active = true;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
            }, {passive: true});

            element.addEventListener('touchmove', (e) => {
                if (!active) return;
                const touch = e.touches[0];
                let dx = touch.clientX - startX;
                let dy = touch.clientY - startY;
                
                // Keep movement bound within joystick circle bounds
                const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
                const angle = Math.atan2(dy, dx);
                
                const mx = Math.cos(angle) * dist;
                const my = Math.sin(angle) * dist;
                
                knob.style.transform = `translate(${mx}px, ${my}px)`;
                callback(mx / 40, my / 40);
            }, {passive: true});

            element.addEventListener('touchend', () => {
                active = false;
                knob.style.transform = 'translate(0px, 0px)';
                callback(0, 0);
            });
        }

        // Connect Joysticks to game inputs
        setupJoystick('joystick-left', 'knob-left', (x, y) => {
            moveVector.set(x, -y); // Y is inverted in web screen space
        });
        setupJoystick('joystick-right', 'knob-right', (x, y) => {
            lookVector.set(x, -y);
        });

        // ==========================================
        // BUILDING AND BREAKING BLOCKS
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const centerPoint = new THREE.Vector2(0, 0); // Always center screen (crosshair target)

        function triggerBuild(isPlacing) {
            raycaster.setFromCamera(centerPoint, camera);
            const intersects = raycaster.intersectObjects(blocksArray);

            if (intersects.length > 0) {
                const hit = intersects[0];
